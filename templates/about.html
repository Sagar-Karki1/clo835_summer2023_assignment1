<!doctype html>
<html>
<head>
    <title>Hello from Flask - {{ user_name }}</title>
    <style>
        body {
            {% if background_image %}
            background-image: url('/static/{{ background_image.split("/")[-1] }}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            {% else %}
            background-color: {{ color }};
            {% endif %}
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .content {
            color: #e4e4e4;
            text-align: center;
            height: 90px;
            vertical-align: middle;
            padding-top: 50px;
            background-color: rgba(0, 0, 0, 0.5);
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div class="content">
        {% if name %}
        <h1>Hello from {{ name }}!</h1>
        {% else %}
        <h1>Hello From {{ user_name }}!</h1>
        {% endif %}

        {% if contents %}
        <textarea rows="10" cols="50">
            {{ contents }}
        </textarea>
        {% endif %}
    </div>
</body>
</html>
